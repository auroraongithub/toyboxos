# Every push to main that changes the app publishes an update release: servers pick it up from
# releases/latest/download/latest.json within 6 hours and their apps offer a restart. The server programs (Windows,
# Linux x64 and arm64) are built fresh each time; the desktop installers (Windows, and Linux from linux-app.yml) and the
# APK are carried over from the previous release, so the latest release always has every download.
name: release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "assets/**"
      - "vendor/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CHANNEL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

jobs:
  server:
    if: github.repository == 'auroraongithub/toyboxos'
    strategy:
      matrix:
        include:
          # 22.04 so the Linux programs run on older glibc too (Debian 12, Ubuntu 22.04, Raspberry Pi OS)
          - { os: ubuntu-22.04, name: toybox-server-linux-x64 }
          - { os: ubuntu-22.04-arm, name: toybox-server-linux-arm64 }
          - { os: windows-latest, name: toybox-server-windows.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: pip install pyinstaller==6.19.0
      - name: Package
        shell: bash
        run: |
          printf '%s' "$CHANNEL" > server/channel.txt
          python server/package.py
          mkdir out && mv native/toybox-server-* "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  release:
    needs: server
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s server -p "test_*.py"
      - name: Build the update
        run: python server/release.py out
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Carry over the installers
        run: gh release download --dir out -p "*-setup.exe" -p "*.apk" -p "*.deb" -p "*.rpm" -p "*.AppImage"
      - name: Publish
        run: |
          chmod +x out/toybox-server-linux-* out/*.AppImage 2>/dev/null || true
          prev=$(gh release view --json tagName -q .tagName)
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$ver-u$GITHUB_RUN_NUMBER"
          {
            echo "Update for toybox.os $ver. Servers install it by themselves within 6 hours; apps then offer a restart."
            echo
            echo "## Changes"
            git log --no-merges --format="- %s" "$prev..HEAD"
            echo
            echo "New here? Download the installer, APK or server below and see the [README](https://github.com/$GITHUB_REPOSITORY#getting-started)."
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "toybox.os $ver update $GITHUB_RUN_NUMBER" \
            --notes-file notes.md --latest out/*
